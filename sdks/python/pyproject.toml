[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tcharize"
version = "0.1.0"
description = "Official Python SDK for the Tcharize localization API"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Tcharize" }]

[project.urls]
Documentation = "https://tcharize.up.railway.app/docs"
Repository = "https://github.com/edenuzoma/tcharize-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/tcharize"]

[tool.pytest.ini_options]
pythonpath = ["src"]
